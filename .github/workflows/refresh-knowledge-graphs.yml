name: Refresh Knowledge Graphs

on:
  workflow_dispatch:
  schedule:
    # Weekdays at 11:30 UTC; adjust to suit the data publication window.
    - cron: '30 11 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'regional_rotation_graph.py'
      - 'rotation_graph_evidence.py'
      - 'scripts/build_regional_rotation_graphs.py'
      - 'scripts/validate_rotation_graph_cache.py'
      - '.github/workflows/refresh-knowledge-graphs.yml'

permissions:
  contents: write

concurrency:
  group: knowledge-graph-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install app dependencies
        run: python -m pip install -r requirements.txt

      - name: Build 9 regional snapshots
        run: python scripts/build_regional_rotation_graphs.py

      - name: Validate membership snapshots and build manifest
        run: python scripts/validate_rotation_graph_cache.py

      - name: Publish refreshed snapshots to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/dashboard_cache/rotation_graphs/
          if git diff --cached --quiet; then
            echo "No cache updates to publish."
          else
            git commit -m "chore: refresh rotation knowledge graph data [skip ci]"
            git push origin HEAD:main
          fi
