name: Refresh Company Sectors (Yahoo Finance)
on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 0'
permissions:
  contents: write
concurrency:
  group: refresh-company-sectors
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sector refresh requirements
        run: python -m pip install 'pandas>=2,<3' 'pyarrow>=15' 'yfinance>=0.2.40'
      - name: Refresh all discovered companies
        run: python scripts/refresh_company_sectors.py --delay 0.7
      - name: Commit updated mapping cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/dashboard_cache/company_sectors/company_sector_mapping.csv data/dashboard_cache/company_sectors/summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh company sector metadata from Yahoo Finance'
            git push
          fi
