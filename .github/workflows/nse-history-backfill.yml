name: Backfill NSE historical index prices
on:
  workflow_dispatch:
    inputs:
      years:
        description: Historical years to request (up to 20)
        required: true
        default: '20'
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch official NSE index history
        run: python scripts/collect_nse_history.py --mode backfill --years "${{ inputs.years }}"
      - name: Commit validated historical data
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || (git commit -m 'Update NSE official historical index data' && git push)
