name: India NSE Constituents Refresh

on:
  workflow_dispatch:
  schedule:
    # 12:30 UTC each weekday (after India market close); snapshots are not intraday holdings.
    - cron: '30 12 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install NSE collector dependencies
        run: python -m pip install 'requests>=2.31'
      - name: Refresh NSE sector and factor constituents
        env:
          NSE_REQUEST_USER_AGENT: ${{ vars.NSE_REQUEST_USER_AGENT }}
        run: |
          python scripts/refresh_india_constituents.py --from-dir data/india_holdings/manual --require-data
      - name: Compute India sector-factor overlaps and membership rankings
        run: python scripts/build_india_overlap_rankings.py
      - name: Write job summary
        if: always()
        run: |
          if [ -f data/india_holdings/build_summary.json ]; then
            echo '## India NSE constituent collection' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/india_holdings/build_summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f data/india_holdings/leadership_build_summary.json ]; then
            echo '## India NSE membership-based rankings' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/india_holdings/leadership_build_summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit verified NSE snapshots, overlaps, rankings and diagnostics
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/india_holdings/
          if ! git diff --cached --quiet; then
            git commit -m 'data: update India NSE index constituent snapshots [skip ci]'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
