name: Refresh Country Rotations
on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * 1-5'
permissions:
  contents: write
jobs:
  build-country-rotations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build country quadrant snapshots
        run: python scripts/build_country_rotation_snapshots.py
      - name: Commit updated country snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/dashboard_cache/rotation_graphs/country_*_rotations.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh country ETF rotation snapshots'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
