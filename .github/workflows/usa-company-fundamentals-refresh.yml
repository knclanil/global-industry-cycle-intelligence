name: USA Company Fundamentals, Quotes and Ranking Refresh
'on':
  workflow_dispatch:
    inputs:
      sec_limit:
        description: 'Max new/stale SEC CompanyFacts downloads (0 = all missing/stale)'
        required: false
        default: '0'
      quotes_limit:
        description: 'Max stale equity quote downloads'
        required: false
        default: '300'
  schedule:
    - cron: '40 14 * * 1-5'
permissions:
  contents: write
concurrency:
  group: market-data-writer
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install yfinance pyarrow requests pandas
      - name: Test USA financial autopilot
        run: python -m unittest discover -s tests -p 'test_usa_financial_autopilot.py' -v
      - name: Test USA fundamental rankings
        run: python -m unittest discover -s tests -p 'test_usa_fundamental_rankings.py' -v
      - name: Test USA ranking integration
        run: python -m unittest discover -s tests -p 'test_usa_complete_ranking_integration.py' -v
      - name: Refresh SEC CompanyFacts for verified issuers
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEC_LIMIT: ${{ inputs.sec_limit || '0' }}
        run: |
          python scripts/refresh_usa_company_fundamentals.py --limit "$SEC_LIMIT" --stale-days 3650 --pause 0.35
      - name: Audit SEC full-universe backfill
        run: |
          python - <<'PY_AUDIT'
          import json
          from pathlib import Path
          report=json.loads(Path('data/usa_research/collection_report.json').read_text())
          print('SEC verified tickers:', report['universe'])
          print('SEC cached after backfill:', report['sec_cached_after'])
          print('SEC fetched this run:', report['sec_fetched'])
          print('SEC failures:', report['sec_failed'])
          if report['sec_failed']:
              print('WARNING: Some SEC requests failed. Details in collection_report.json.')
          PY_AUDIT
      - name: Build company research from locally cached SEC filings
        run: python scripts/build_usa_research.py
      - name: Enrich fundamentally ready issuers with dated market prices
        env:
          QUOTES_LIMIT: ${{ inputs.quotes_limit || '300' }}
        run: |
          python scripts/usa_quote_coverage_pilot.py --limit "$QUOTES_LIMIT" --pause 1.0
      - name: Rebuild research, quantify missing metrics, update both-market coverage
        run: |
          python scripts/build_usa_research.py
          python scripts/usa_financial_gap_report.py
          python scripts/unified_fundamental_coverage.py
          python scripts/build_usa_fundamental_rankings.py
          python scripts/usa_all_ticker_coverage.py
      - name: Enforce identity and output integrity
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          p=Path('data/usa_research/company_research.csv')
          assert p.exists()
          df=pd.read_csv(p,low_memory=False)
          assert len(df)>0 and df.company_key.notna().all() and df.company_key.is_unique
          rank_path=Path('data/usa_research/fundamental_rankings.csv')
          assert rank_path.exists(), 'Missing generated fundamental ranking table'
          ranked=pd.read_csv(rank_path)
          assert len(ranked)==len(df), 'Ranked table must preserve full verified issuer universe'
          assert ranked['company_key'].astype(str).is_unique
          report=json.loads(Path('data/usa_research/completion_report.json').read_text())
          assert report['universe']==len(df)
          assert report['both_ready']<=min(report['fundamental_ready'],report['valuation_ready'])
          print('USA company financial coverage:',json.dumps(report,indent=2))
          PY
      - name: Publish USA cache, quotes and research results with clean worktree
        shell: bash
        run: |
          set -euo pipefail
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          src="$PWD"
          temp="$(mktemp -d)"
          trap 'git worktree remove --force "$temp/pub" 2>/dev/null || true; rm -rf "$temp"' EXIT
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git worktree remove --force "$temp/pub" 2>/dev/null || true
            git worktree add --detach "$temp/pub" origin/main
            for dir in data/fundamentals data/sec_cache data/usa_research; do
              if [ -d "$src/$dir" ]; then
                mkdir -p "$temp/pub/$dir"
                cp -a "$src/$dir/." "$temp/pub/$dir/"
                git -C "$temp/pub" add -f -- "$dir"
              fi
            done
            file='data/research_coverage/fundamental_coverage.json'
            if [ -f "$src/$file" ]; then
              mkdir -p "$temp/pub/$(dirname "$file")"
              cp "$src/$file" "$temp/pub/$file"
              git -C "$temp/pub" add -f -- "$file"
            fi
            if git -C "$temp/pub" diff --cached --quiet; then
              echo 'Financial datasets already current'; exit 0
            fi
            git -C "$temp/pub" commit -m 'data: USA SEC fundamentals and market valuations [skip ci]'
            if git -C "$temp/pub" push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          echo 'USA financial dataset publication failed after five attempts' >&2
          exit 1
      - name: Summary
        if: always()
        shell: bash
        run: |
          for f in data/usa_research/collection_report.json data/usa_research/quote_pilot_report.json data/usa_research/completion_report.json data/usa_research/all_ticker_financial_coverage.json; do
            if [ -f "$f" ]; then
              echo "### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
