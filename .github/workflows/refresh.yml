name: Refresh market data and publisher feed
on:
  workflow_dispatch:
  schedule:
    - cron: '25 23 * * 1-5'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect prices
        run: python scripts/collect_prices.py
      - name: Analyze available prices
        run: python scripts/analyze.py
      - name: Collect NSE India sector snapshot
        run: python scripts/collect_nse_indices.py
      - name: Collect publication metadata
        run: python scripts/monitor_publishers.py
        continue-on-error: true
      - name: Commit updated data when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || (git commit -m 'Refresh market observations and research feed' && git push)
