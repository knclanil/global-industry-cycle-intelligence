name: Build dashboard database snapshots
on:
  workflow_dispatch:
    inputs:
      include_sec:
        description: 'Also compute SEC / India historical quality views (slow)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 9 * * 2-6'
permissions:
  contents: write
concurrency:
  group: dashboard-cache-writer
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Materialize repository-backed views
        env:
          INCLUDE_SEC: ${{ inputs.include_sec || 'false' }}
        run: |
          if [ "$INCLUDE_SEC" = 'true' ]; then
            python scripts/build_dashboard_cache.py --include-sec
          else
            python scripts/build_dashboard_cache.py
          fi
      - name: Commit derived views
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dashboard_cache/
          if ! git diff --cached --quiet; then
            git commit -m 'data: rebuild dashboard materialized views [skip ci]'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
