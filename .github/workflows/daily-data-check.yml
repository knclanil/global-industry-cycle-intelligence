name: Daily US sector data check
on:
  schedule:
    # 23:30 UTC = 6:30 PM EST / 7:30 PM EDT, after the US close.
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python daily_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-data-quality-report
          path: data_quality_report.json
          if-no-files-found: warn
