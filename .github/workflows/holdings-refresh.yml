name: Verified iShares holdings refresh
on:
  schedule:
    - cron: '30 1 * * 2-6'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-data-writer
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch, validate, compare and rank holdings
        run: python scripts/refresh_holdings.py
      - name: Upload holdings diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holdings-source-diagnostics
          path: data/holdings/diagnostics/*.json
          if-no-files-found: ignore
      - name: Commit verified holdings snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/holdings/
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh verified holdings and leadership rankings [skip ci]'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
