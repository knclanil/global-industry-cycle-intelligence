name: USA Quote and Valuation Coverage Pilot
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Verified symbols; leave blank to prioritize fundamentally ready issuers'
        default: ''
        required: false
      limit:
        description: 'Max stale quote attempts (25 recommended)'
        default: '25'
        required: false
permissions:
  contents: write
concurrency:
  group: market-data-writer
  cancel-in-progress: false
jobs:
  usa_quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install yfinance pyarrow
      - name: Run USA-only offline tests
        run: python -m unittest discover -s tests -p 'test_usa_quote_coverage_pilot.py' -v
      - name: Collect quotes from verified USA holdings
        env:
          TICKERS: ${{ inputs.tickers || '' }}
          LIMIT: ${{ inputs.limit || '25' }}
        shell: bash
        run: python scripts/usa_quote_coverage_pilot.py --tickers "$TICKERS" --limit "$LIMIT"
      - name: Rebuild USA company research and coverage
        run: |
          python scripts/build_usa_research.py
          python scripts/unified_fundamental_coverage.py
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          p=Path('data/usa_research/company_research.csv')
          assert p.exists(), 'Research builder did not publish output'
          data=pd.read_csv(p)
          assert len(data)>0 and data.company_key.is_unique
          report=json.loads(Path('data/usa_research/quote_pilot_report.json').read_text())
          print('USA quote trial:',report)
          print('USA company dataset:',len(data))
          PY
      - name: Summarize data coverage
        if: always()
        shell: bash
        run: |
          for f in data/usa_research/quote_pilot_report.json data/usa_research/build_report.json data/research_coverage/fundamental_coverage.json; do
            if [ -f "$f" ]; then
              echo "### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Publish only USA quote and generated research data
        shell: bash
        run: |
          set -euo pipefail
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          source_dir="$PWD"
          temp="$(mktemp -d)"
          trap 'git worktree remove --force "$temp/pub" 2>/dev/null || true; rm -rf "$temp"' EXIT
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git worktree remove --force "$temp/pub" 2>/dev/null || true
            git worktree add --detach "$temp/pub" origin/main
            for file in data/usa_research/quotes.csv data/usa_research/quote_pilot_report.json data/usa_research/company_research.csv data/usa_research/build_report.json data/research_coverage/fundamental_coverage.json; do
              mkdir -p "$temp/pub/$(dirname "$file")"
              cp "$source_dir/$file" "$temp/pub/$file"
              git -C "$temp/pub" add "$file"
            done
            if git -C "$temp/pub" diff --cached --quiet; then echo 'No changed USA datasets'; exit 0; fi
            git -C "$temp/pub" commit -m 'data: USA quote coverage pilot [skip ci]'
            if git -C "$temp/pub" push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo 'Failed to publish USA pilot outputs' >&2
          exit 1
