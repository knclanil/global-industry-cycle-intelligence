name: Refresh India Asset Flow Diagnostics
on:
  workflow_dispatch:
  schedule:
    - cron: '45 12 * * 1-5'
permissions:
  contents: write
concurrency:
  group: india-asset-flow-refresh-main
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install existing recovery wrapper
        run: python scripts/install_india_asset_fix.py
      - name: Update dashboard to read the canonical stored keys
        run: python scripts/install_india_asset_dashboard_fix.py
      - name: Refresh AND persist asset history
        run: python scripts/refresh_india_asset_data.py
      - name: Verify stored coverage and price snapshots
        run: |
          test -s data/dashboard_cache/india_asset_flow_coverage.csv
          test -s data/market/IndiaAssets/%5ENSEI.parquet
          python - <<'PY'
          from stored_market_data import read_one
          from india_asset_market_data import SECTORS, BENCHMARK
          import pandas as pd
          coverage = {t: len(read_one('IndiaAssets', t)) for t in [*SECTORS, BENCHMARK]}
          print('Persisted sessions:', coverage)
          assert coverage[BENCHMARK] >= 100, 'Benchmark missing or insufficient'
          assert sum(coverage[t] >= 100 for t in SECTORS) >= 1, 'No usable asset histories'
          PY
      - name: Publish price histories and diagnostics safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/market/IndiaAssets/*.parquet data/market/IndiaAssets/sources.json
          git add -f data/dashboard_cache/india_asset_flow_coverage.csv
          git add india_asset_market_data.py dashboard.py
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'Persist India asset flow market prices [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Cannot safely rebase generated data.'
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'Published IndiaAssets price parquet snapshots.'
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
