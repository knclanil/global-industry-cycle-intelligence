name: Refresh India Asset Flow Diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: '45 12 * * 1-5'

permissions:
  contents: write

concurrency:
  group: india-asset-flow-refresh-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install recovery wrapper for this run
        run: python scripts/install_india_asset_fix.py

      - name: Refresh source coverage diagnostics
        run: python scripts/refresh_india_asset_data.py

      - name: Validate coverage output
        shell: bash
        run: |
          set -euo pipefail
          test -s data/dashboard_cache/india_asset_flow_coverage.csv
          python - <<'PY'
          import pandas as pd
          p = 'data/dashboard_cache/india_asset_flow_coverage.csv'
          data = pd.read_csv(p)
          needed = {'ticker', 'observations', 'last_date', 'source', 'status'}
          missing = needed - set(data.columns)
          if missing:
              raise SystemExit(f'Coverage report missing columns: {sorted(missing)}')
          print(data.to_string(index=False))
          PY

      # The install script edits india_asset_market_data.py in the original
      # checkout. Never rebase that dirty checkout. Publish only the generated
      # coverage CSV from a separate clean worktree built from current main.
      - name: Publish coverage from clean worktree (safe retries)
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_CSV="$GITHUB_WORKSPACE/data/dashboard_cache/india_asset_flow_coverage.csv"
          TARGET_CSV='data/dashboard_cache/india_asset_flow_coverage.csv'
          WORKTREE="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$WORKTREE" 2>/dev/null || true
            rm -rf "$WORKTREE"
          }
          trap cleanup EXIT

          git fetch origin main
          git worktree add --detach "$WORKTREE" origin/main
          git -C "$WORKTREE" config user.name 'github-actions[bot]'
          git -C "$WORKTREE" config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            echo "Publish attempt ${attempt}/5"
            git -C "$WORKTREE" fetch origin main
            git -C "$WORKTREE" reset --hard origin/main
            mkdir -p "$WORKTREE/data/dashboard_cache"
            cp "$SOURCE_CSV" "$WORKTREE/$TARGET_CSV"
            git -C "$WORKTREE" add -f "$TARGET_CSV"
            if git -C "$WORKTREE" diff --cached --quiet; then
              echo 'Coverage CSV already up to date; no push needed.'
              exit 0
            fi
            git -C "$WORKTREE" commit -m 'Refresh India asset history coverage [skip ci]'
            if git -C "$WORKTREE" push origin HEAD:main; then
              echo 'Coverage CSV published successfully.'
              exit 0
            fi
            echo 'main advanced during publication; retrying safely.'
            sleep $((attempt * 3))
          done
          echo 'Could not publish after 5 attempts; no force push attempted.' >&2
          exit 1
