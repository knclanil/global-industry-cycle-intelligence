name: SEC fundamentals refresh
on:
  schedule:
    - cron: '15 4 * * 2-6'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-data-writer
  cancel-in-progress: false
jobs:
  fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh SEC company facts
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/refresh_fundamentals.py --limit 250
      - name: Commit verified SEC snapshots
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fundamentals/
          if ! git diff --cached --quiet; then
            git commit -m 'data: update verified SEC fundamental facts [skip ci]'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
